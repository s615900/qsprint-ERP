        status: { type: string, enum: [洽談中, 籌備中, 拍攝中, 後製修圖, 客戶校稿, 已交付, 已結案, 取消] }
        shoot_date: { type: ["string", "null"] }
        due_date: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        assigned_staff: { type: ["string", "null"] }
        delivery_link: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    # ── Invoicing & tax ───────────────────────────────────────
    CompanySettings:
      type: object
      required: [name, tax_id, tax_reg_number, owner, address, phone, email, bank_account, tax_rate]
      properties:
        name: { type: string }
        tax_id: { type: string }
        tax_reg_number: { type: string }
        owner: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        bank_account: { type: string }
        tax_rate: { type: integer }

    CompanySettingsInput:
      type: object
      required: [name, tax_id, tax_reg_number, owner, address, phone, email, bank_account, tax_rate]
      properties:
        name: { type: string }
        tax_id: { type: string }
        tax_reg_number: { type: string }
        owner: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        bank_account: { type: string }
        tax_rate: { type: integer, minimum: 0, maximum: 100 }

    InvoiceTrack:
      type: object
      required: [id, period, kind, prefix, range_start, range_end, next_number, used, remaining, created_at]
      properties:
        id: { type: integer }
        period: { type: string, description: "YYYY-MM of the first month" }
        kind: { type: string, enum: [三聯式, 二聯式, 電子發票] }
        prefix: { type: string }
        range_start: { type: integer }
        range_end: { type: integer }
        next_number: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
        created_at: { type: string, format: date-time }

    InvoiceTrackInput:
      type: object
      required: [period, kind, prefix, range_start, range_end]
      properties:
        period: { type: string }
        kind: { type: string, enum: [三聯式, 二聯式, 電子發票] }
        prefix: { type: string, pattern: "^[A-Za-z]{2}$" }
        range_start: { type: integer, minimum: 0, maximum: 99999999 }
        range_end: { type: integer, minimum: 0, maximum: 99999999 }

    Invoice:
      type: object
      required: [id, invoice_number, kind, invoice_date, period, buyer_name, tax_type, sales_amount, tax_amount, total, allowance_total, items, status, created_at]
      properties:
        id: { type: integer }
        invoice_number: { type: string }
        track_id: { type: ["integer", "null"] }
        kind: { type: string, enum: [三聯式, 二聯式, 電子發票, 免用發票] }
        invoice_date: { type: string }
        period: { type: string }
        customer_id: { type: ["integer", "null"] }
        order_id: { type: ["integer", "null"] }
        order_number: { type: ["string", "null"] }
        buyer_name: { type: string }
        buyer_tax_id: { type: ["string", "null"] }
        tax_type: { type: string, enum: [應稅, 零稅率, 免稅] }
        sales_amount: { type: integer }
        tax_amount: { type: integer }
        total: { type: integer }
        allowance_total: { type: integer, description: "Sum of active allowances issued against this invoice" }
        items: { type: array, items: { $ref: "#/components/schemas/LineItem" } }
        carrier: { type: ["string", "null"] }
        donate_code: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        status: { type: string, enum: [已開立, 已作廢] }
        void_reason: { type: ["string", "null"] }
        voided_at: { type: ["string", "null"], format: date-time }
        created_at: { type: string, format: date-time }

    InvoiceInput:
      type: object
      required: [kind, invoice_date, buyer_name, total]
      properties:
        kind: { type: string, enum: [三聯式, 二聯式, 電子發票, 免用發票] }
        invoice_date: { type: string, description: YYYY-MM-DD }
        invoice_number: { type: ["string", "null"], description: "Leave empty to take the next number from the matching block" }
        customer_id: { type: ["integer", "null"] }
        order_id: { type: ["integer", "null"] }
        buyer_name: { type: string, minLength: 1 }
        buyer_tax_id: { type: ["string", "null"] }
        tax_type: { type: string, enum: [應稅, 零稅率, 免稅] }
        total: { type: integer, minimum: 1, description: "Tax-inclusive total; sales and tax are derived from it" }
        items: { type: array, items: { $ref: "#/components/schemas/LineItem" } }
        carrier: { type: ["string", "null"] }
        donate_code: { type: ["string", "null"] }
        note: { type: ["string", "null"] }

    InvoiceVoidInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    InvoiceAllowance:
      type: object
      required: [id, allowance_number, invoice_id, invoice_number, allowance_date, period, sales_amount, tax_amount, total, status, created_at]
      properties:
        id: { type: integer }
        allowance_number: { type: string }
        invoice_id: { type: integer }
        invoice_number: { type: string }
        allowance_date: { type: string }
        period: { type: string }
        sales_amount: { type: integer }
        tax_amount: { type: integer }
        total: { type: integer }
        reason: { type: ["string", "null"] }
        status: { type: string, enum: [有效, 作廢] }
        created_at: { type: string, format: date-time }

    InvoiceAllowanceInput:
      type: object
      required: [invoice_id, allowance_date, total]
      properties:
        invoice_id: { type: integer }
        allowance_date: { type: string }
        total: { type: integer, minimum: 1, description: "Tax-inclusive amount being allowed" }
        reason: { type: ["string", "null"] }

    TaxFiling:
      type: object
      required: [period, status]
      properties:
        period: { type: string }
        status: { type: string, enum: [未申報, 已申報] }
        filed_at: { type: ["string", "null"], format: date-time }
        carry_in_override: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }

    TaxFilingInput:
      type: object
      properties:
        status: { type: string, enum: [未申報, 已申報] }
        carry_in_override: { type: ["integer", "null"] }
        note: { type: ["string", "null"] }

    TaxPeriodSummary:
      type: object
      required: [period, status, sales_total, output_tax, input_tax, payable, carry_out, invoice_count, deadline]
      properties:
        period: { type: string }
        status: { type: string, enum: [未申報, 已申報] }
        sales_total: { type: integer }
        output_tax: { type: integer }
        input_tax: { type: integer }
        payable: { type: integer }
        carry_out: { type: integer }
        invoice_count: { type: integer }
        deadline: { type: string }

    TaxAmountRow:
      type: object
      required: [key, label, count, amount, tax]
      properties:
        key: { type: string }
        label: { type: string }
        count: { type: integer }
        amount: { type: integer, description: "Sales amount (output) or purchase amount (input), before tax" }
        tax: { type: integer }

    TaxReport:
      type: object
      required: [period, start, end, deadline, filing, company, voided_count, output_rows, allowances, taxable_sales, taxable_tax, zero_rate, exempt, sales_total, input_rows, input_deductible_amount, input_deductible_tax, non_deductible, output_tax, input_tax, carry_in, net_tax, payable, carry_out, invoices, allowance_list, purchases, missing_vouchers, warnings]
      properties:
        period: { type: string }
        start: { type: string }
        end: { type: string }
        deadline: { type: string }
        filing: { $ref: "#/components/schemas/TaxFiling" }
        company: { $ref: "#/components/schemas/CompanySettings" }
        output_rows: { type: array, items: { $ref: "#/components/schemas/TaxAmountRow" }, description: "應稅銷售額 by invoice kind (before allowances)" }
        allowances: { $ref: "#/components/schemas/TaxAmountRow" }
        taxable_sales: { type: integer, description: "應稅銷售額合計, net of allowances" }
        taxable_tax: { type: integer }
        zero_rate: { $ref: "#/components/schemas/TaxAmountRow" }
        exempt: { $ref: "#/components/schemas/TaxAmountRow" }
        sales_total: { type: integer, description: 銷售額總計 }
        input_rows: { type: array, items: { $ref: "#/components/schemas/TaxAmountRow" }, description: "Deductible purchases by voucher family and 進貨及費用/固定資產" }
        input_deductible_amount: { type: integer }
        input_deductible_tax: { type: integer }
        non_deductible: { $ref: "#/components/schemas/TaxAmountRow" }
        output_tax: { type: integer, description: 本期銷項稅額合計 }
        input_tax: { type: integer, description: 得扣抵進項稅額合計 }
        carry_in: { type: integer, description: 上期累積留抵稅額 }
        net_tax: { type: integer, description: "output_tax − input_tax − carry_in (negative = credit)" }
        payable: { type: integer, description: 本期應實繳稅額 }
        carry_out: { type: integer, description: 本期申報留抵稅額 }
        invoices: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
        allowance_list: { type: array, items: { $ref: "#/components/schemas/InvoiceAllowance" } }
        purchases: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        missing_vouchers: { type: array, items: { $ref: "#/components/schemas/Transaction" }, description: "Expenses in the period with no voucher information" }
        voided_count: { type: integer, description: Voided invoices in the period }
        warnings: { type: array, items: { type: string } }
